services:

  node-app:
    build:
      context: .
      dockerfile: Dockerfile
    
    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - app-network

  nginx:
    image: nginx:1.31.6
    
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      node-app:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
